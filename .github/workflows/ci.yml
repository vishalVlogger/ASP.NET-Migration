name: ci
on:
  push:
  pull_request:
jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore WebFormsMigrator.slnx
      - run: dotnet build WebFormsMigrator.slnx --configuration Release --no-restore
      - run: dotnet test WebFormsMigrator.slnx --configuration Release --no-build
